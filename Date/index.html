<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./style.css" rel="stylesheet" />
    <script src="./script.js" defer></script>
    <title>Sample</title>
  </head>
  <body>
    <section class="timer">
      <button onclick="timerInstance.start()">Сколько время?</button>
      <div class="timer__content">
        <div class="timer__hours"></div>
        <span class="timer__separator" aria-hidden="true"></span>

        <div class="timer__minutes"></div>

        <span class="timer__separator" aria-hidden="true"></span>

        <div class="timer__seconds"></div>

        <span class="timer__separator" aria-hidden="true"></span>

        <div class="timer__milliseconds"></div>
      </div>
      <button onclick="timerInstance.stop()">Остановить</button>
    </section>
  </body>
  <script></script>
</html>
